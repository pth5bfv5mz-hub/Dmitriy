# Реестр компетенций. Общий на все дисциплины проекта.
#
# ВАЖНО. Формулировки взяты из ФГОС СПО 38.02.03, утверждённого приказом
# Минобрнауки России от 28.07.2014 № 834. По ФГОС-2022 (приказ Минпросвещения
# России от 21.04.2022 № 257) формулировки получить не удалось — см. docs/research.md,
# раздел 6. Поле `verified` управляет пометкой в документах:
#   full    — формулировка подтверждена, печатается как есть
#   partial — подтверждена одним источником, печатается с пометкой [сверить с РП]
#   none    — не найдена, печатается как [ОК-?] / [ПК-?] и попадает в отчёт расхождений

standard:
  code: "38.02.03"
  name: "Операционная деятельность в логистике"
  order: "приказ Минобрнауки России от 28.07.2014 № 834"
  note_alt_standard: >-
    Действует также ФГОС СПО, утверждённый приказом Минпросвещения России
    от 21.04.2022 № 257 (в ред. от 03.07.2024). Формулировки ОК/ПК по нему
    не подтверждены; при работе по этому стандарту коды нужно заменить.

ok:
  "ОК 1":
    text: "Понимать сущность и социальную значимость своей будущей профессии, проявлять к ней устойчивый интерес"
    verified: full
  "ОК 2":
    text: "Организовывать собственную деятельность, выбирать типовые методы и способы выполнения профессиональных задач, оценивать их эффективность и качество"
    verified: full
  "ОК 3":
    text: "Принимать решения в стандартных и нестандартных ситуациях и нести за них ответственность"
    verified: full
  "ОК 4":
    text: "Осуществлять поиск и использование информации, необходимой для эффективного выполнения профессиональных задач, профессионального и личностного развития"
    verified: full
  "ОК 5":
    text: "Использовать информационно-коммуникационные технологии в профессиональной деятельности"
    verified: partial
  "ОК 6":
    text: "Работать в коллективе и команде, эффективно общаться с коллегами, руководством, потребителями"
    verified: partial
  "ОК 7":
    text: "Брать на себя ответственность за работу членов команды (подчинённых), результат выполнения заданий"
    verified: partial
  "ОК 8":
    text: "Самостоятельно определять задачи профессионального и личностного развития, заниматься самообразованием, осознанно планировать повышение квалификации"
    verified: partial
  "ОК 9":
    text: "Ориентироваться в условиях частой смены технологий в профессиональной деятельности"
    verified: full

pk:
  # ПМ.04 — основной модуль дисциплины
  "ПК 4.1":
    text: "Проводить контроль выполнения и экспедирования заказов"
    module: "ПМ.04"
    verified: full
  "ПК 4.2":
    text: "Организовывать приём и проверку товаров (гарантия получения заказа, проверка качества, подтверждение получения заказанного количества, оформление на получение и регистрацию сырья); контролировать оплату поставок"
    module: "ПМ.04"
    verified: full
  "ПК 4.3":
    text: "Подбирать и анализировать основные критерии оценки рентабельности систем складирования, транспортировки"
    module: "ПМ.04"
    verified: full
  "ПК 4.4":
    text: "Определять критерии оптимальности функционирования подразделения (участка) логистической системы с учётом целей и задач организации в целом"
    module: "ПМ.04"
    verified: full
  # ПМ.03 — включены по содержанию (расчёт издержек и оценка эффективности звеньев ЛС).
  # Если методист колледжа возражает — убрать из lesson-конфигов, реестр править не нужно.
  "ПК 3.1":
    text: "Владеть методологией оценки эффективности функционирования элементов логистической системы"
    module: "ПМ.03"
    verified: partial
  "ПК 3.2":
    text: "Составлять программу и осуществлять мониторинг показателей работы на уровне подразделения (участка) логистической системы (поставщиков, посредников, перевозчиков и эффективность работы складского хозяйства и каналов распределения)"
    module: "ПМ.03"
    verified: partial
  "ПК 3.3":
    text: "Рассчитывать и анализировать логистические издержки"
    module: "ПМ.03"
    verified: full
  "ПК 3.4":
    text: "Применять современные логистические концепции и принципы сокращения логистических расходов"
    module: "ПМ.03"
    verified: full
