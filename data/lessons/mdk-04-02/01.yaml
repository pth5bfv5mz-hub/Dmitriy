# Занятие 1. Введение в МДК. Зачем оценивать логистику
# 1 ак. ч (45 мин). Все числа в примерах и заданиях условные.

lesson_type: "комбинированное занятие: вводное занятие с элементами беседы"
lesson_form: "фронтальная, работа в парах"
methods: "объяснительно-иллюстративный, беседа, репродуктивный"

# Занятие на 1 ак. ч — презентация короче стандартной
slide_count_override: [9, 12]

goals:
  teaching: >-
    Дать представление о задачах МДК.04.02 и месте курса в профессиональном
    модуле ПМ.04; показать, зачем предприятию нужна оценка логистики;
    научить рассчитывать долю логистических издержек в выручке и объяснять
    полученное число.
  developing: >-
    Развивать умение выделять логистические процессы в знакомой
    хозяйственной деятельности, сравнивать числовые показатели и делать
    по ним вывод.
  upbringing: >-
    Формировать интерес к профессии операционного логиста, понимание
    ответственности специалиста за расход средств предприятия.

results:
  know: >-
    задачи и структуру курса МДК.04.02; форму промежуточной аттестации;
    что показывает доля логистических издержек в выручке
  can: >-
    называть логистические процессы конкретного предприятия; рассчитывать
    долю логистических издержек в выручке и объяснять результат

competencies:
  pk: ["ПК 4.4", "ПК 3.1"]
  ok: ["ОК 1", "ОК 2", "ОК 4"]

equipment:
  - "Мультимедийный проектор, экран, ноутбук"
  - "Презентация «Занятие 1. Введение в МДК. Зачем оценивать логистику»"
  - "Раздаточный материал: бланк мини-опроса (по числу студентов)"
  - "Калькуляторы (или калькулятор телефона)"
  - "Рабочая программа МДК.04.02, перечень экзаменационных вопросов"

keywords:
  - "логистическая система"
  - "логистические издержки"
  - "доля издержек в выручке"
  - "эффективность логистики"
  - "оценка логистики"
  - "показатель"
  - "ПМ.04"

stages:
  - block: org
    stage: "Организационный момент"
    time: "3 мин"
    minutes: 3
    teacher: >-
      Приветствует группу, отмечает присутствующих. Называет дисциплину,
      объём курса (84 часа, 2 семестра) и форму аттестации — экзамен
      во 2 семестре.
    student: >-
      Занимают места, записывают в тетрадь название МДК, объём курса
      и форму аттестации.

  - block: theory
    stage: "Мотивация. Слайд-вопрос"
    time: "4 мин"
    minutes: 4
    teacher: >-
      Показывает слайд-вопрос: предприятие продало товар на 50 млн руб. —
      сколько из этой суммы забрала логистика? Предлагает назвать
      предположения, записывает 2–3 версии на доске.
    student: >-
      Высказывают предположения, обосновывают их. Фиксируют вопрос
      в тетради, чтобы вернуться к нему в конце занятия.

  - block: theory
    stage: "Зачем предприятию оценивать логистику"
    time: "8 мин"
    minutes: 8
    teacher: >-
      Объясняет пять практических причин: увидеть расход денег, сравнить
      варианты доставки, найти узкие места, поставить цели подразделениям,
      подтвердить эффект решений. Даёт бытовые примеры к каждой причине.
    student: >-
      Слушают, записывают причины в тетрадь. Приводят собственные примеры
      по одной-двум причинам.

  - block: theory
    stage: "Место МДК.04.02 в модуле ПМ.04. Структура курса"
    time: "8 мин"
    minutes: 8
    teacher: >-
      Показывает схему «цели предприятия — показатели — расчёт и анализ —
      решение». Разбирает таблицу разделов курса с часами и контрольными
      точками, называет форму экзамена и порядок допуска.
    student: >-
      Переносят в тетрадь схему и перечень разделов курса. Задают вопросы
      по форме экзамена и контрольным точкам.

  - block: theory
    stage: "Разбор числового примера: доля логистических издержек"
    time: "9 мин"
    minutes: 9
    teacher: >-
      Полностью разбирает на доске пример: складывает четыре группы затрат,
      делит сумму на выручку, переводит в проценты. Затем сравнивает два
      предприятия с долей 12 % и 18 % и показывает разницу в рублях.
      Подчёркивает: посчитать — половина работы, вторая половина —
      объяснить полученное число.
    student: >-
      Повторяют расчёт в тетради вместе с преподавателем, проверяют
      результат на калькуляторе. Формулируют вслух вывод по примеру.

  - block: practice
    stage: "Мини-опрос: логистические процессы знакомой компании"
    time: "10 мин"
    minutes: 10
    teacher: >-
      Выдаёт бланк мини-опроса, объясняет задание: выбрать знакомую
      компанию и назвать пять её логистических процессов, указав для
      каждого исполнителя и измеримый признак. Проходит по аудитории,
      помогает наводящими вопросами.
    student: >-
      Заполняют бланк индивидуально, при затруднении обсуждают в паре.
      Двое-трое зачитывают свои варианты, остальные дополняют.

  - block: final
    stage: "Подведение итогов. Домашнее задание"
    time: "3 мин"
    minutes: 3
    teacher: >-
      Возвращается к слайду-вопросу, сопоставляет предположения студентов
      с расчётом. Собирает бланки, объявляет домашнее задание, называет
      опорный учебник.
    student: >-
      Отвечают на вопросы слайда «Закрепление», сдают бланки, записывают
      домашнее задание.

homework:
  text: >-
    Выбрать знакомую компанию (магазин, пункт выдачи заказов, кафе,
    автосервис) и письменно описать пять её логистических процессов.
  bullets:
    - "Для каждого процесса указать, кто его выполняет"
    - "Написать, что в этом процессе можно измерить"
    - "Объём работы — до одной страницы"
  source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

literature:
  - "Гаджинский А. М. Логистика: учебник. — 21-е изд. — М.: Дашков и К, 2017. — 420 с."
  - "Гаджинский А. М. Практикум по логистике. — М.: Дашков и К, 2017. — 320 с."
  - "Левкин Г. Г. Логистика: теория и практика: учебник и практикум для СПО. — 2-е изд., испр. и доп. — М.: Юрайт, 2019."
  - "Неруш Ю. М., Неруш А. Ю. Логистика. Практикум: учебное пособие для СПО. — М.: Юрайт, 2019."

teacher_notes:
  - "Занятие рассчитано на 45 минут (1 ак. ч), презентация укорочена до 11 слайдов."
  - "Числа в примере подобраны так, чтобы деление давало ровно 0,12 — считается без калькулятора."
  - "Бланки мини-опроса лучше собрать: они пригодятся на занятии 4 при разборе процесса на операции."

slides:
  - type: title
    goals:
      - "Понять, зачем предприятию оценивать логистику"
      - "Узнать структуру курса и форму экзамена"
      - "Научиться считать долю логистических издержек"
      - "Научиться объяснять полученное число"

  - type: question
    heading: "С чего начнём"
    question: "Предприятие продало товар на 50 000 000 руб. за год. Сколько из этой суммы забрала логистика?"
    hints:
      - "Из чего вообще состоят расходы на логистику"
      - "Как понять, много это или мало"
      - "С чем сравнивать результат"

  - type: bullets
    heading: "Зачем предприятию оценивать логистику"
    lead: "Пять причин, по которым считают показатели"
    bullets:
      - "Увидеть, куда уходят деньги предприятия"
      - "Сравнить варианты доставки по затратам"
      - "Найти узкие места в процессах"
      - "Поставить цели складу и транспорту"
      - "Подтвердить эффект принятых решений"

  - type: scheme
    heading: "Логика курса: от цели к решению"
    style: chain
    blocks:
      - title: "Цели предприятия"
        sub: "снизить затраты, ускорить доставку"
      - title: "Показатели"
        sub: "что именно измеряем"
      - title: "Расчёт и анализ"
        sub: "считаем, сравниваем"
        accent: true
      - title: "Решение"
        sub: "что меняем в работе"
    note: "Наш курс — третий шаг: считать показатели и объяснять результат."

  - type: table
    heading: "Структура курса: 84 часа"
    header: ["Разделы", "Часы", "Что считаем"]
    widths: [42, 12, 46]
    align: ["l", "c", "l"]
    rows:
      - ["1. Логистическая система", "11", "Цикл заказа, правило 7R"]
      - ["2. Логистические издержки", "10", "Совокупные затраты, доля"]
      - ["3. Оценка запасов", "18", "Оборачиваемость, ABC/XYZ"]
      - ["4–5. Склад и транспорт", "14", "Грузооборот, пробег, тариф"]
      - ["6–7. Сервис и KPI", "16", "Уровень сервиса, OTIF, KPI"]
      - ["8–9. Контроль и обобщение", "15", "План — факт, аутсорсинг"]
    note: "1 семестр — 39 ч, 2 семестр — 45 ч. Четыре контрольные точки. Экзамен во 2 семестре."

  - type: example
    heading: "Пример 1. Условие и первые действия"
    given:
      - "Выручка за год — 50 000 000 руб."
      - "Транспорт — 2 400 000 руб., склад — 1 800 000 руб."
      - "Содержание запасов — 1 300 000 руб."
      - "Закупки и управление — 500 000 руб."
    steps:
      - label: "Складываем все логистические затраты"
        calc: "2 400 000 + 1 800 000 + 1 300 000 + 500 000 = 6 000 000 руб."
      - label: "Делим затраты на выручку"
        calc: "6 000 000 / 50 000 000 = 0,12"

  - type: example
    heading: "Пример 1. Результат и его смысл"
    steps:
      - label: "Переводим долю в проценты"
        calc: "0,12 × 100 % = 12 %"
      - label: "Читаем полученное число"
        comment: "Из каждых 100 рублей выручки 12 рублей ушло на логистику."
      - label: "Проверяем обратным счётом"
        calc: "50 000 000 × 0,12 = 6 000 000 руб."
    answer: "логистика забрала 12 % выручки — 6 млн руб. из 50 млн руб."

  - type: example
    heading: "Пример 2. Сравниваем два предприятия"
    given:
      - "Предприятие А — доля издержек 12 %"
      - "Предприятие Б — доля издержек 18 %"
      - "Выручка у обоих одинаковая — 50 000 000 руб."
    steps:
      - label: "Считаем издержки предприятия Б"
        calc: "50 000 000 × 0,18 = 9 000 000 руб."
      - label: "Находим разницу с предприятием А"
        calc: "9 000 000 − 6 000 000 = 3 000 000 руб."
    answer: "у Б логистика дороже на 3 000 000 руб. при той же выручке"

  - type: two_col
    heading: "Два способа управлять логистикой"
    columns:
      - title: "На глаз"
        items:
          - "«Кажется, доставка дорогая»"
          - "Решения по интуиции руководителя"
          - "Причину роста затрат не находят"
          - "Спор решается громкостью голоса"
      - title: "По показателям"
        items:
          - "«Доля издержек выросла с 12 до 15 %»"
          - "Решения по расчёту вариантов"
          - "Видно, какое звено дало рост"
          - "Спор решается цифрой"

  - type: check
    heading: "Закрепление"
    questions:
      - "Зачем предприятию считать логистические издержки?"
      - "Как найти долю логистических издержек в выручке?"
      - "У предприятия доля 15 %. Много это или мало и от чего зависит ответ?"
      - "Почему недостаточно только посчитать показатель?"

  - type: summary
    heading: "Итог занятия"
    bullets:
      - "Логистику оценивают числом, а не словами"
      - "Базовый показатель — доля издержек в выручке"
      - "Формула простая: затраты делим на выручку"
      - "Посчитать мало — нужно объяснить результат"
      - "Курс — 84 часа, аттестация в форме экзамена"

  - type: homework
    heading: "Домашнее задание"
    text: "Описать пять логистических процессов знакомой компании."
    bullets:
      - "Указать исполнителя каждого процесса"
      - "Написать, что в процессе можно измерить"
      - "Объём — до одной страницы"
    source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

practice:
  kind: case
  duration: "10 мин"
  form: "индивидуально, при затруднении — обсуждение в паре"
  goal: >-
    Научиться выделять логистические процессы в работе конкретного
    предприятия и указывать для каждого процесса измеримый признак.
  situation: >-
    Выберите компанию, работу которой вы наблюдали лично: продуктовый
    магазин, пункт выдачи заказов, кафе, автосервис, аптеку. Рассмотрите
    её как логистическую систему: товар откуда-то приходит, где-то хранится,
    как-то попадает к покупателю.
  data:
    - title: "Бланк для заполнения"
      table:
        header: ["№", "Логистический процесс", "Кто выполняет", "Что можно измерить"]
        widths: [7, 33, 25, 35]
        rows:
          - ["1", "", "", ""]
          - ["2", "", "", ""]
          - ["3", "", "", ""]
          - ["4", "", "", ""]
          - ["5", "", "", ""]
      note: "Название выбранной компании укажите над таблицей."
  questions:
    - "Назовите пять логистических процессов выбранной компании."
    - "Укажите для каждого процесса исполнителя."
    - "Назовите для каждого процесса измеримый признак (в рублях, штуках, минутах, процентах)."
    - "Выберите один процесс и объясните, что покажет его измерение."
  steps:
    - "Напишите над таблицей название выбранной компании и вид её деятельности."
    - "Проследите путь товара: от кого приходит, где хранится, как попадает к покупателю."
    - "Выпишите в таблицу пять процессов на этом пути."
    - "Для каждого процесса укажите исполнителя: сотрудник компании, поставщик, перевозчик."
    - "Для каждого процесса подберите измеримый признак и укажите единицу измерения."
    - "Под таблицей одним предложением объясните, что покажет измерение одного из процессов."
  criteria:
    - ["«5»", "Названы 5 процессов, все относятся к логистике; для всех указан исполнитель и измеримый признак с единицей измерения; вывод сформулирован верно"]
    - ["«4»", "Названы 5 процессов; допущены 1–2 неточности в исполнителях или единицах измерения; вывод сформулирован"]
    - ["«3»", "Названы 3–4 процесса; измеримые признаки указаны не для всех; вывод общий, без опоры на признак"]
    - ["«2»", "Названо менее 3 процессов либо перечисленное не относится к логистике; измеримые признаки не указаны"]
  criteria_note: >-
    Логистическим считается процесс, связанный с движением или хранением
    товара, оформлением заказа и поставки. Приготовление блюда, реклама,
    подбор персонала логистическими процессами не являются.
  common_mistakes:
    - "Вместо процесса называют подразделение («склад», «отдел закупок»)."
    - "Измеримый признак указывают без единицы измерения («быстро», «много»)."
    - "В список попадают процессы, не связанные с движением товара."
  solution:
    steps:
      - label: "Пример заполнения для пункта выдачи заказов (данные условные)"
        comment: >-
          Принимается любая корректно заполненная таблица по любой компании.
          Ниже — образец полноты и уровня детализации.
    table:
      header: ["№", "Логистический процесс", "Кто выполняет", "Что можно измерить"]
      widths: [7, 33, 25, 35]
      rows:
        - ["1", "Приёмка привезённых заказов", "Сотрудник пункта выдачи", "Время приёмки партии, мин"]
        - ["2", "Размещение посылок по ячейкам", "Сотрудник пункта выдачи", "Число посылок на сотрудника за смену, шт."]
        - ["3", "Хранение до прихода клиента", "Пункт выдачи", "Средний срок хранения посылки, дней"]
        - ["4", "Выдача заказа покупателю", "Сотрудник пункта выдачи", "Время обслуживания одного клиента, мин"]
        - ["5", "Возврат отказных заказов на склад", "Перевозчик", "Доля возвратов от числа выданных, %"]
    answer: >-
      пять процессов относятся к движению и хранению товара; для каждого
      подобран измеримый признак с единицей измерения
    conclusion: >-
      Пример вывода: «Если средний срок хранения посылки вырастет с 2 до
      5 дней, ячеек перестанет хватать — придётся либо расширять пункт,
      либо напоминать клиентам о заказе. Значит, этот показатель нужно
      измерять постоянно».
