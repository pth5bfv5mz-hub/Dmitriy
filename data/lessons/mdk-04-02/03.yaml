# Занятие 3. Виды логистических систем. Границы системы
# 2 ак. ч (90 мин). Все числа в примерах и заданиях условные.

lesson_type: "комбинированное занятие: усвоение новых знаний и применение их в разборе кейсов"
lesson_form: "фронтальная, индивидуальная"
methods: "объяснительно-иллюстративный, репродуктивный, практический (разбор кейсов)"

goals:
  teaching: >-
    Научить различать микро- и макрологистические системы, прямые,
    эшелонированные и гибкие системы; научить определять границу
    логистической системы и показать на расчёте, что даёт появление
    промежуточного звена.
  developing: >-
    Развивать умение относить конкретный случай к типу по признакам,
    обосновывать отнесение, сравнивать варианты организации потока
    по числу маршрутов и сумме затрат.
  upbringing: >-
    Воспитывать доказательность суждений: вывод подкрепляется признаком
    или расчётом, а не общими словами.

results:
  know: >-
    признаки микро- и макрологистических систем; виды систем по числу
    посредников (прямая, эшелонированная, гибкая); правило определения
    границы логистической системы
  can: >-
    определять вид логистической системы по описанию и обосновывать
    отнесение; определять границу системы; сравнивать прямую
    и эшелонированную схемы по числу маршрутов и по затратам

competencies:
  pk: ["ПК 4.4", "ПК 4.3", "ПК 3.1"]
  ok: ["ОК 2", "ОК 3", "ОК 4"]

equipment:
  - "Мультимедийный проектор, экран, ноутбук"
  - "Презентация «Занятие 3. Виды логистических систем. Границы системы»"
  - "Раздаточный материал: три кейса и бланк ответа (по числу студентов)"
  - "Калькуляторы"
  - "Домашние схемы логистических систем (задание занятия 2)"

keywords:
  - "микрологистическая система"
  - "макрологистическая система"
  - "прямая логистическая система"
  - "эшелонированная система"
  - "гибкая логистическая система"
  - "граница логистической системы"
  - "распределительный центр"
  - "посредник"

stages:
  - block: org
    stage: "Организационный момент"
    time: "3 мин"
    minutes: 3
    teacher: >-
      Приветствует группу, отмечает присутствующих. Собирает схемы
      логистических систем — домашнее задание занятия 2.
    student: >-
      Сдают схемы, готовят тетради и калькуляторы.

  - block: theory
    stage: "Актуализация и слайд-вопрос"
    time: "6 мин"
    minutes: 6
    teacher: >-
      Показывает 2–3 домашние схемы, спрашивает, чем они отличаются
      по числу участников. Ставит слайд-вопрос: почему завод не возит
      товар в каждый магазин напрямую, а строит распределительный склад?
      Фиксирует версии на доске.
    student: >-
      Сравнивают схемы, высказывают предположения по вопросу,
      записывают вопрос в тетрадь.

  - block: theory
    stage: "Микро- и макрологистические системы"
    time: "11 мин"
    minutes: 11
    teacher: >-
      Даёт определения микро- и макрологистической системы, разбирает
      таблицу сравнения по четырём признакам: масштаб, участники,
      цель, кто управляет. Приводит по два примера на каждый вид.
    student: >-
      Записывают определения и таблицу сравнения, приводят свои
      примеры для каждого вида.

  - block: theory
    stage: "Виды систем по числу посредников"
    time: "12 мин"
    minutes: 12
    teacher: >-
      Показывает три схемы: прямая, эшелонированная, гибкая. На каждой
      называет признак и типичный случай применения. Разбирает таблицу
      сравнения трёх видов.
    student: >-
      Переносят три схемы в тетрадь, подписывают признаки. Определяют,
      к какому виду относится их домашняя схема.

  - block: theory
    stage: "Разбор числового примера: маршруты и затраты"
    time: "14 мин"
    minutes: 14
    teacher: >-
      Полностью разбирает пример: 3 поставщика и 4 магазина, считает число
      прямых маршрутов и число маршрутов через распределительный склад,
      находит сокращение в процентах. Затем считает затраты по двум схемам
      и показывает, что дешевле, но что появилось новое звено и лишний день.
      Возвращается к слайду-вопросу и даёт ответ на него.
    student: >-
      Выполняют расчёты в тетради вместе с преподавателем, проверяют
      на калькуляторе, формулируют вывод и объясняют, за что заплатили,
      получив экономию.

  - block: theory
    stage: "Граница логистической системы"
    time: "5 мин"
    minutes: 5
    teacher: >-
      Формулирует правило: границу задаёт тот, кто оценивает систему,
      исходя из своей зоны ответственности. Показывает, как одна и та же
      цепь поставок даёт разные границы для завода, для перевозчика
      и для торговой сети.
    student: >-
      Записывают правило и три варианта границы для одной цепи.

  - block: practice
    stage: "Практическое задание: три кейса на определение вида системы"
    time: "34 мин"
    minutes: 34
    teacher: >-
      Выдаёт бланки с тремя кейсами, объясняет порядок выполнения
      и критерии оценки. Первый признак в первом кейсе разбирает вместе
      с группой как образец. Консультирует индивидуально, следит
      за временем, за 5 минут до конца собирает работы.
    student: >-
      Читают кейсы, определяют вид системы по двум классификациям,
      обосновывают отнесение ссылкой на признак, указывают границу
      системы, выполняют расчёт по третьему кейсу, формулируют вывод.

  - block: final
    stage: "Подведение итогов. Домашнее задание"
    time: "5 мин"
    minutes: 5
    teacher: >-
      Проводит закрепление по вопросам слайда, разбирает наиболее частую
      ошибку в работах, объявляет домашнее задание.
    student: >-
      Отвечают на вопросы закрепления, записывают домашнее задание.

homework:
  text: >-
    Определить вид логистической системы для своей компании (схема
    из задания занятия 2) по двум классификациям и обосновать отнесение.
  bullets:
    - "Указать вид по масштабу: микро- или макрологистическая"
    - "Указать вид по числу посредников"
    - "На каждый вид привести признак из конспекта"
    - "Назвать границу системы и объяснить, почему она проходит так"
  source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

literature:
  - "Гаджинский А. М. Логистика: учебник. — 21-е изд. — М.: Дашков и К, 2017. — 420 с."
  - "Гаджинский А. М. Практикум по логистике. — М.: Дашков и К, 2017. — 320 с."
  - "Левкин Г. Г. Логистика: теория и практика: учебник и практикум для СПО. — 2-е изд., испр. и доп. — М.: Юрайт, 2019."

teacher_notes:
  - "Пример с маршрутами (3 × 4 = 12 против 3 + 4 = 7) — опорный для всего курса: к нему возвращаемся на занятии 10 (конфликт издержек) и на занятии 40 (аутсорсинг)."
  - "Сознательно показываем обратную сторону экономии: новое звено и лишний день обработки. Это готовит понятие trade-off."
  - "Термин «эшелонированная» студенты путают со «складской»: подчеркнуть, что признак — наличие посредника между производителем и потребителем."

slides:
  - type: title
    goals:
      - "Различать микро- и макрологистические системы"
      - "Знать три вида систем по числу посредников"
      - "Определять границу логистической системы"
      - "Сравнивать схемы по маршрутам и затратам"

  - type: question
    heading: "Вопрос для начала"
    question: "Почему завод не возит товар в каждый магазин напрямую, а строит распределительный склад?"
    hints:
      - "Сколько получится маршрутов при прямой доставке"
      - "Что дороже: рейс или обработка на складе"
      - "Чем приходится платить за экономию"

  - type: definition
    heading: "Две системы по масштабу"
    term: "Микрологистическая система"
    text: >-
      логистическая система одного предприятия: его закупки, склады,
      транспорт и сбыт, которыми предприятие управляет само.
    bullets:
      - "Макрологистическая — уровень региона, отрасли, страны"
      - "В макросистеме много независимых предприятий"
      - "Цель микросистемы — прибыль предприятия"

  - type: two_col
    heading: "Микро- и макрологистические системы"
    columns:
      - title: "Микрологистическая"
        items:
          - "Масштаб: одно предприятие"
          - "Участники: свои подразделения"
          - "Цель: снизить затраты предприятия"
          - "Управляет: руководство предприятия"
          - "Пример: логистика хлебозавода"
      - title: "Макрологистическая"
        items:
          - "Масштаб: регион, отрасль, страна"
          - "Участники: независимые предприятия"
          - "Цель: развитие территории, отрасли"
          - "Управляет: орган власти, ассоциация"
          - "Пример: транспортный узел региона"

  - type: scheme
    heading: "Прямая логистическая система"
    style: chain
    blocks:
      - title: "Производитель"
        sub: "изготовил товар"
      - title: "Потребитель"
        sub: "получил товар"
        accent: true
    note: "Признак: посредников между производителем и потребителем нет. Применяют при крупных партиях и малом числе покупателей."

  - type: scheme
    heading: "Эшелонированная логистическая система"
    style: chain
    blocks:
      - title: "Производитель"
        sub: "отгрузил партию"
      - title: "Посредник"
        sub: "распределительный склад"
        accent: true
      - title: "Потребитель"
        sub: "получил свой объём"
    note: "Признак: между производителем и потребителем есть хотя бы один посредник. Чем больше посредников, тем больше эшелонов."

  - type: table
    heading: "Три вида систем по числу посредников"
    header: ["Вид", "Признак", "Когда применяют"]
    widths: [22, 39, 39]
    bold_first_col: true
    rows:
      - ["Прямая", "Посредников нет", "Крупные партии, мало покупателей"]
      - ["Эшелонированная", "Есть посредник (склад, дилер)", "Много мелких покупателей"]
      - ["Гибкая", "Часть потока напрямую, часть через посредника", "Есть и крупные, и мелкие клиенты"]
    note: "Гибкая система — не «средняя», а сознательное сочетание двух схем для разных групп клиентов."

  - type: example
    heading: "Пример 1. Считаем число маршрутов"
    given:
      - "3 поставщика отгружают товар, 4 магазина его принимают"
      - "Вариант А — прямая доставка каждому магазину"
      - "Вариант Б — через один распределительный склад"
    steps:
      - label: "Вариант А: каждый поставщик едет в каждый магазин"
        calc: "3 × 4 = 12 маршрутов"
      - label: "Вариант Б: поставщики на склад, склад по магазинам"
        calc: "3 + 4 = 7 маршрутов"

  - type: example
    heading: "Пример 1. Насколько сократились маршруты"
    given:
      - "Вариант А — 12 маршрутов"
      - "Вариант Б — 7 маршрутов"
    steps:
      - label: "Считаем сокращение в процентах"
        calc: "(12 − 7) / 12 × 100 % = 5 / 12 × 100 % ≈ 41,7 %"
      - label: "Читаем результат"
        comment: "Склад собрал потоки в одну точку — рейсов стало почти вдвое меньше."
    answer: "склад сократил число маршрутов с 12 до 7 — почти на 42 %"

  - type: example
    heading: "Пример 2. Считаем затраты по двум вариантам"
    given:
      - "Маршрут — 8 000 руб.; обработка — 300 руб./т; партия — 20 т"
    steps:
      - label: "Затраты по варианту А (прямая доставка)"
        calc: "12 × 8 000 = 96 000 руб."
      - label: "Затраты по варианту Б (через склад)"
        calc: "7 × 8 000 + 20 × 300 = 56 000 + 6 000 = 62 000 руб."
      - label: "Находим экономию"
        calc: "96 000 − 62 000 = 34 000 руб."
    answer: "вариант Б дешевле на 34 000 руб., но добавляет звено и день"

  - type: bullets
    heading: "Где проходит граница системы"
    lead: "Правило: границу задаёт тот, кто оценивает систему"
    bullets:
      - "Внутри границы — считаем показатели и отвечаем"
      - "За границей — только учитываем как условие"
      - "Для завода перевозчик — внешнее звено"
      - "Для перевозчика его машины — внутри системы"
      - "Одна цепь даёт разные границы разным участникам"

  - type: check
    heading: "Закрепление"
    questions:
      - "Чем микрологистическая система отличается от макрологистической?"
      - "По какому признаку систему называют эшелонированной?"
      - "5 поставщиков и 6 магазинов. Сколько маршрутов при прямой доставке и сколько через один склад?"
      - "Почему экономия на маршрутах не означает, что вариант лучше?"
      - "Кто определяет границу логистической системы и по какому правилу?"

  - type: summary
    heading: "Итог занятия"
    bullets:
      - "По масштабу системы бывают микро- и макро-"
      - "По числу посредников — прямые, эшелонированные, гибкие"
      - "Посредник сокращает число маршрутов и затраты"
      - "Плата за это — новое звено и время"
      - "Границу системы задаёт тот, кто её оценивает"

  - type: homework
    heading: "Домашнее задание"
    text: "Определить вид логистической системы своей компании по двум классификациям."
    bullets:
      - "Вид по масштабу и вид по числу посредников"
      - "На каждый вид — признак из конспекта"
      - "Указать границу системы и обосновать её"
    source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

practice:
  kind: case
  duration: "30 мин (из 34 мин практического блока)"
  form: "индивидуально"
  goal: >-
    Научиться определять вид логистической системы по описанию, обосновывать
    отнесение ссылкой на признак, указывать границу системы и сравнивать
    прямую и эшелонированную схемы расчётом.
  situation: >-
    Ниже приведены три описания. Все предприятия и числовые данные условные.
    По каждому кейсу определите вид логистической системы по двум
    классификациям и обоснуйте отнесение. По кейсу 3 дополнительно
    выполните расчёт.
  data:
    - title: "Кейс 1. Завод железобетонных изделий «Монолит»"
      text: >-
        Завод изготавливает плиты перекрытий и отгружает их четырём крупным
        строительным организациям области. Плиты вывозят машинами заказчиков
        прямо с площадки завода. Посредников между заводом и строителями нет.
        Складов готовой продукции за пределами завода предприятие не имеет.
        Логистикой на заводе занимается свой отдел отгрузки.
    - title: "Кейс 2. Транспортно-логистический узел области"
      text: >-
        В области действует программа развития грузовых перевозок. В неё
        входят два железнодорожных грузовых терминала, речной порт,
        четырнадцать транспортных компаний и шесть складских комплексов
        разных владельцев. Программу координирует областное министерство
        транспорта: согласует режим работы терминалов и очерёдность
        подачи вагонов, но собственником компаний не является.
    - title: "Кейс 3. Торговая сеть «Пятый сезон»"
      text: >-
        Сеть закупает бытовую химию у 5 производителей и продаёт её
        в 8 своих магазинах города. Крупные партии сеть везёт от
        производителей на собственный распределительный центр, а оттуда
        развозит по магазинам. Небольшие партии срочного ассортимента
        производители по договору отвозят прямо в магазины, минуя
        распределительный центр.
    - title: "Данные для расчёта по кейсу 3 (условные)"
      table:
        header: ["Показатель", "Значение"]
        widths: [62, 38]
        align: ["l", "c"]
        rows:
          - ["Число производителей, ед.", "5"]
          - ["Число магазинов сети, ед.", "8"]
          - ["Стоимость одного маршрута, руб.", "9 000"]
          - ["Обработка на распределительном центре, руб./т", "250"]
          - ["Объём партии, т", "24"]
      note: "Данные условные, используются в учебных целях."
    - title: "Бланк ответа"
      table:
        header: ["Кейс", "Вид по масштабу", "Вид по числу посредников", "Признак-обоснование", "Граница системы"]
        widths: [8, 20, 24, 28, 20]
        rows:
          - ["1", "", "", "", ""]
          - ["2", "", "", "", ""]
          - ["3", "", "", "", ""]
  questions:
    - "К какому виду по масштабу относится каждая из трёх систем?"
    - "К какому виду по числу посредников относится каждая система?"
    - "Какой признак послужил основанием для отнесения в каждом случае?"
    - "Где проходит граница системы в каждом кейсе?"
    - "Кейс 3: сколько маршрутов даёт прямая доставка и сколько — доставка через распределительный центр? На сколько процентов сокращается число маршрутов?"
    - "Кейс 3: во сколько обойдётся каждый вариант и какой из них дешевле?"
  steps:
    - "Прочитайте кейс 1. Найдите в тексте, есть ли между изготовителем и потребителем посредник, и кто управляет системой."
    - "Заполните первую строку бланка: вид по масштабу, вид по числу посредников, признак-обоснование, граница системы."
    - "Повторите то же для кейсов 2 и 3."
    - "В обосновании пишите признак, а не пересказ кейса: например «посредников между заводом и потребителями нет»."
    - "По кейсу 3 посчитайте число прямых маршрутов: число производителей умножьте на число магазинов."
    - "Посчитайте число маршрутов через распределительный центр: число производителей сложите с числом магазинов."
    - "Найдите сокращение числа маршрутов в процентах."
    - "Посчитайте затраты по обоим вариантам и определите, какой дешевле."
    - "Одним предложением запишите, чем сеть платит за экономию."
  formulas:
    - title: "Число маршрутов при прямой доставке"
      formula: "Мпр = П × М"
      legend:
        - "Мпр — число маршрутов при прямой доставке, ед."
        - "П — число производителей (поставщиков), ед."
        - "М — число магазинов (потребителей), ед."
      units: "единицы"
    - title: "Число маршрутов через распределительный центр"
      formula: "Мрц = П + М"
      legend:
        - "Мрц — число маршрутов через распределительный центр, ед."
        - "П — число производителей, ед."
        - "М — число магазинов, ед."
      units: "единицы"
    - title: "Сокращение числа маршрутов"
      formula: "ΔМ = (Мпр − Мрц) / Мпр × 100 %"
      legend:
        - "ΔМ — сокращение числа маршрутов, %"
        - "Мпр — число маршрутов при прямой доставке, ед."
        - "Мрц — число маршрутов через распределительный центр, ед."
      units: "проценты"
    - title: "Затраты по варианту через распределительный центр"
      formula: "Зрц = Мрц × Цм + Q × Соб"
      legend:
        - "Зрц — затраты по варианту через распределительный центр, руб."
        - "Мрц — число маршрутов, ед."
        - "Цм — стоимость одного маршрута, руб."
        - "Q — объём партии, т"
        - "Соб — стоимость обработки на распределительном центре, руб./т"
      units: "рубли"
  criteria:
    - ["«5»", "Все три вида определены верно по двум классификациям; обоснования опираются на признак; границы указаны верно; расчёт по кейсу 3 выполнен без ошибок; вывод о плате за экономию сформулирован"]
    - ["«4»", "Все три вида определены верно; в обоснованиях или границах 1 неточность; расчёт верен; вывод сформулирован"]
    - ["«3»", "Верно определены 2 кейса из 3; в расчёте 1 арифметическая ошибка; обоснования подменены пересказом кейса"]
    - ["«2»", "Верно определён 1 кейс или ни один; расчёт не выполнен либо выполнен неверно; обоснований нет"]
  criteria_note: >-
    Обоснованием считается ссылка на признак вида системы. Пересказ условия
    кейса обоснованием не является.
  common_mistakes:
    - "Кейс 2 относят к микрологистической системе: смущает, что есть координатор. Признак макросистемы — независимые предприятия, а министерство не собственник."
    - "Кейс 3 относят к эшелонированной, не замечая прямых поставок срочного ассортимента: сочетание двух схем — это гибкая система."
    - "Число маршрутов через центр считают умножением, а не сложением."
    - "В затратах по варианту через центр забывают прибавить обработку на тонну."
  solution:
    steps:
      - label: "Кейс 1. Завод «Монолит»"
        comment: >-
          Микрологистическая (масштаб — одно предприятие, управляет свой
          отдел отгрузки). Прямая (признак: посредников между заводом
          и строительными организациями нет). Граница: от площадки завода
          до момента передачи плит заказчику; машины заказчиков — за границей.
      - label: "Кейс 2. Транспортно-логистический узел области"
        comment: >-
          Макрологистическая (масштаб — область, участники — независимые
          предприятия разных владельцев, координатор не собственник).
          Эшелонированная (признак: между грузоотправителем и получателем
          есть терминалы, порт и складские комплексы). Граница: территория
          области и входящие в программу объекты.
      - label: "Кейс 3. Сеть «Пятый сезон»"
        comment: >-
          Микрологистическая (одно предприятие — торговая сеть). Гибкая
          (признак: крупные партии идут через распределительный центр,
          срочный ассортимент — напрямую в магазины). Граница: от приёмки
          товара у производителей до передачи товара в магазины сети;
          сами производители — за границей.
      - label: "Действие 1. Число маршрутов при прямой доставке"
        calc: "Мпр = 5 × 8 = 40 маршрутов"
      - label: "Действие 2. Число маршрутов через распределительный центр"
        calc: "Мрц = 5 + 8 = 13 маршрутов"
      - label: "Действие 3. Сокращение числа маршрутов"
        calc: "ΔМ = (40 − 13) / 40 × 100 % = 27 / 40 × 100 % = 67,5 %"
      - label: "Действие 4. Затраты при прямой доставке"
        calc: "Зпр = 40 × 9 000 = 360 000 руб."
      - label: "Действие 5. Затраты через распределительный центр"
        calc: "Зрц = 13 × 9 000 + 24 × 250 = 117 000 + 6 000 = 123 000 руб."
      - label: "Действие 6. Экономия"
        calc: "Э = 360 000 − 123 000 = 237 000 руб."
    table:
      header: ["Показатель", "Прямая доставка", "Через центр"]
      widths: [46, 27, 27]
      align: ["l", "c", "c"]
      rows:
        - ["Число маршрутов, ед.", "40", "13"]
        - ["Затраты на маршруты, руб.", "360 000", "117 000"]
        - ["Обработка на центре, руб.", "—", "6 000"]
        - ["Итого затрат, руб.", "360 000", "123 000"]
    answer: >-
      кейс 1 — микрологистическая прямая; кейс 2 — макрологистическая
      эшелонированная; кейс 3 — микрологистическая гибкая. По кейсу 3:
      маршрутов 40 против 13, сокращение 67,5 %; затраты 360 000 руб.
      против 123 000 руб., экономия 237 000 руб.
    conclusion: >-
      Сеть платит за экономию появлением дополнительного звена —
      распределительного центра. Товар проходит лишнюю обработку, срок
      доставки до магазина увеличивается, а сам центр требует площади,
      персонала и техники. Именно поэтому срочный ассортимент сеть
      сознательно везёт напрямую, сохраняя гибкую схему.
