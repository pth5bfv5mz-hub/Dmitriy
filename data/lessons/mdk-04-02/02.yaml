# Занятие 2. Логистическая система: понятие, элементы, звенья
# 2 ак. ч (90 мин). Все числа в примерах и заданиях условные.

lesson_type: "комбинированное занятие: усвоение новых знаний и первичное закрепление"
lesson_form: "фронтальная, индивидуальная"
methods: "объяснительно-иллюстративный, репродуктивный, практический (разбор кейса)"

goals:
  teaching: >-
    Сформировать понятие логистической системы; научить различать элемент
    и звено логистической системы, определять вход и выход системы,
    выделять звенья и связи по описанию предприятия.
  developing: >-
    Развивать умение выделять части целого и связи между ними, читать
    описание предприятия как схему движения материального потока,
    выполнять простой расчёт по выделенным звеньям.
  upbringing: >-
    Воспитывать точность в работе с профессиональными понятиями,
    ответственность за результат при работе с описанием реального
    производственного процесса.

results:
  know: >-
    определение логистической системы; понятия «элемент», «звено», «связь»,
    «вход», «выход»; признаки логистической системы
  can: >-
    выделять звенья логистической системы по описанию предприятия;
    определять вход и выход системы; считать число звеньев, связей
    и долю собственных звеньев

competencies:
  pk: ["ПК 4.4", "ПК 3.1"]
  ok: ["ОК 2", "ОК 3", "ОК 4"]

equipment:
  - "Мультимедийный проектор, экран, ноутбук"
  - "Презентация «Занятие 2. Логистическая система: понятие, элементы, звенья»"
  - "Раздаточный материал: практическое задание (по числу студентов)"
  - "Калькуляторы"
  - "Опорный конспект: схема «вход — логистическая система — выход»"

keywords:
  - "логистическая система"
  - "элемент логистической системы"
  - "звено логистической системы"
  - "связи в системе"
  - "вход и выход системы"
  - "материальный поток"
  - "признаки системы"

stages:
  - block: org
    stage: "Организационный момент"
    time: "3 мин"
    minutes: 3
    teacher: >-
      Приветствует группу, отмечает присутствующих, проверяет готовность
      к занятию. Собирает домашнее задание занятия 1 (описание пяти
      логистических процессов).
    student: >-
      Сдают домашнее задание, готовят тетради и калькуляторы.

  - block: theory
    stage: "Проверка домашнего задания и мотивация. Слайд-вопрос"
    time: "6 мин"
    minutes: 6
    teacher: >-
      Зачитывает 2–3 примера из домашних работ. Ставит слайд-вопрос:
      магазин, склад, перевозчик и поставщик — это четыре разные фирмы
      или одна система? Фиксирует ответы, обещает вернуться к вопросу.
    student: >-
      Слушают примеры однокурсников, высказывают своё мнение по вопросу,
      обосновывают позицию.

  - block: theory
    stage: "Определение логистической системы. Признаки системы"
    time: "12 мин"
    minutes: 12
    teacher: >-
      Даёт рабочее определение логистической системы, разбирает четыре
      признака: целостность, связи, организация, единая цель. На каждом
      признаке показывает, что будет, если он отсутствует.
    student: >-
      Записывают определение и признаки. Проверяют пример из слайда-вопроса
      на соответствие четырём признакам.

  - block: theory
    stage: "Элемент и звено. Вход и выход системы"
    time: "13 мин"
    minutes: 13
    teacher: >-
      Разграничивает понятия «элемент» и «звено» на таблице сравнения.
      Показывает схему «вход — логистическая система — выход», объясняет,
      что подаётся на вход и что снимается с выхода. Разбирает таблицу
      типовых звеньев.
    student: >-
      Переносят в тетрадь схему и таблицу сравнения. Приводят примеры
      элементов и звеньев для знакомого предприятия.

  - block: theory
    stage: "Разбор числового примера: считаем звенья и связи"
    time: "13 мин"
    minutes: 13
    teacher: >-
      Полностью разбирает пример по условному хлебозаводу: выделяет звенья,
      считает свои и сторонние, находит долю собственных звеньев. Затем
      считает число связей в цепи и показывает, как растёт число связей
      при добавлении магазинов. Формулирует вывод.
    student: >-
      Выполняют расчёт в тетради вместе с преподавателем, проверяют деление
      на калькуляторе, формулируют вывод своими словами.

  - block: theory
    stage: "Типичные ошибки при выделении звеньев"
    time: "4 мин"
    minutes: 4
    teacher: >-
      Перечисляет три типичные ошибки: подмена звена подразделением,
      пропуск сторонних участников, потеря входа и выхода.
    student: >-
      Записывают ошибки, задают уточняющие вопросы.

  - block: practice
    stage: "Практическое задание: разбор описания предприятия"
    time: "34 мин"
    minutes: 34
    teacher: >-
      Выдаёт бланки задания, объясняет порядок выполнения и критерии оценки.
      Первое звено разбирает вместе с группой как образец. Далее проходит
      по аудитории, консультирует индивидуально, следит за временем.
      За 5 минут до конца собирает работы.
    student: >-
      Читают описание условного предприятия, заполняют таблицу звеньев,
      определяют вход и выход системы, считают число звеньев, связей
      и долю собственных звеньев, формулируют вывод. Сдают работы.

  - block: final
    stage: "Подведение итогов. Домашнее задание"
    time: "5 мин"
    minutes: 5
    teacher: >-
      Возвращается к слайду-вопросу, даёт обоснованный ответ. Проводит
      закрепление по вопросам слайда, объявляет домашнее задание,
      выставляет оценки за наиболее удачные работы.
    student: >-
      Отвечают на вопросы закрепления, записывают домашнее задание.

homework:
  text: >-
    По компании, которую вы описывали в домашнем задании занятия 1,
    построить схему логистической системы.
  bullets:
    - "Начертить звенья прямоугольниками, связи — стрелками"
    - "Подписать вход и выход системы"
    - "Отметить, какие звенья свои, а какие сторонние"
    - "Посчитать число звеньев и долю собственных"
  source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

literature:
  - "Гаджинский А. М. Логистика: учебник. — 21-е изд. — М.: Дашков и К, 2017. — 420 с."
  - "Гаджинский А. М. Практикум по логистике. — М.: Дашков и К, 2017. — 320 с."
  - "Левкин Г. Г. Логистика: теория и практика: учебник и практикум для СПО. — 2-е изд., испр. и доп. — М.: Юрайт, 2019."

teacher_notes:
  - "Определение даётся в упрощённой формулировке для уровня СПО; академическую формулировку из учебника показать на слайде-определении как дополнение."
  - "В примере число связей считается для линейной цепи (звеньев минус один) — этого достаточно; ветвления не разбираем."
  - "Домашние схемы понадобятся на занятии 3 при определении вида логистической системы."

slides:
  - type: title
    goals:
      - "Понять, что такое логистическая система"
      - "Научиться различать элемент и звено"
      - "Определять вход и выход системы"
      - "Считать звенья, связи и долю своих звеньев"

  - type: question
    heading: "Вопрос для начала"
    question: "Магазин, склад, перевозчик и поставщик — это четыре разные фирмы или одна система?"
    hints:
      - "Есть ли у них общая цель"
      - "Что будет, если одно звено остановится"
      - "Кто отвечает за результат целиком"

  - type: definition
    heading: "Логистическая система"
    term: "Логистическая система (ЛС)"
    text: >-
      совокупность связанных между собой звеньев, которая доводит
      материальный поток от поставщика до потребителя и управляется
      как единое целое.
    bullets:
      - "Ключевое слово — «связанных между собой»"
      - "Управление общее, а не по каждому звену"
      - "Цель у всех звеньев одна"

  - type: bullets
    heading: "Четыре признака логистической системы"
    lead: "Нет хотя бы одного признака — системы нет, есть набор участников"
    bullets:
      - "Целостность: части работают на общий результат"
      - "Связи: звенья обмениваются товаром, информацией"
      - "Организация: связи упорядочены, а не случайны"
      - "Единая цель: доставить нужный товар вовремя"

  - type: scheme
    heading: "Вход и выход логистической системы"
    style: chain
    blocks:
      - title: "ВХОД"
        sub: "сырьё, товары, заказы, информация"
      - title: "ЛОГИСТИЧЕСКАЯ СИСТЕМА"
        sub: "закупка, хранение, перевозка, отгрузка"
        accent: true
      - title: "ВЫХОД"
        sub: "товар у потребителя, выполненный заказ"
    note: "Границу системы задаёт тот, кто её оценивает: что внутри — считаем, что снаружи — только учитываем."

  - type: two_col
    heading: "Элемент и звено: в чём разница"
    columns:
      - title: "Элемент ЛС"
        items:
          - "Неделимая часть в рамках задачи"
          - "Примеры: погрузчик, стеллаж, кладовщик"
          - "Внутри одного звена"
          - "Дальше не разбираем"
      - title: "Звено ЛС"
        items:
          - "Обособленный участник с своей функцией"
          - "Примеры: поставщик, перевозчик, склад"
          - "Может быть отдельной организацией"
          - "Состоит из элементов"

  - type: table
    heading: "Типовые звенья логистической системы"
    header: ["Звено", "Что делает", "Что у него измеряют"]
    widths: [26, 38, 36]
    rows:
      - ["Поставщик", "Отгружает сырьё и товары", "Соблюдение сроков, доля брака"]
      - ["Перевозчик", "Доставляет груз между точками", "Пробег, срок доставки, тариф"]
      - ["Склад", "Принимает, хранит, комплектует", "Грузооборот, использование площади"]
      - ["Производство", "Перерабатывает сырьё", "Объём выпуска, длительность цикла"]
      - ["Магазин (потребитель)", "Принимает и продаёт товар", "Полнота заказа, дефицит"]

  - type: example
    heading: "Пример 1. Считаем звенья условного хлебозавода"
    given:
      - "Мука приходит от сторонней мельницы, везёт сторонний перевозчик"
      - "Свои: склад сырья, цех, склад готовой продукции, свой транспорт"
      - "Хлеб принимают 12 магазинов сети"
    steps:
      - label: "Выписываем звенья по пути потока и считаем их"
        calc: "мельница → перевозчик → склад сырья → цех → склад ГП → транспорт"
        comment: "Всего 6 звеньев, свои 4. Магазины — за границей системы завода."
      - label: "Находим долю собственных звеньев"
        calc: "4 / 6 × 100 % = 66,7 %"
    answer: "6 звеньев, из них 4 свои — 66,7 % цепи под прямым контролем"

  - type: example
    heading: "Пример 2. Считаем связи и читаем результат"
    given:
      - "В цепи 6 звеньев, выстроены последовательно"
      - "На выходе — 12 магазинов сети"
    steps:
      - label: "Связи в последовательной цепи"
        calc: "6 − 1 = 5 связей"
        comment: "В цепочке связей всегда на одну меньше, чем звеньев."
      - label: "Добавляем 12 магазинов вместо одного выхода"
        calc: "5 − 1 + 12 = 16 связей"
    answer: "16 связей; каждая связь — место возможного сбоя потока"

  - type: bullets
    heading: "Типичные ошибки при выделении звеньев"
    bullets:
      - "Вместо звена называют подразделение предприятия"
      - "Забывают сторонних участников: перевозчика, поставщика"
      - "Теряют вход и выход системы"
      - "Смешивают элемент и звено в одном списке"

  - type: check
    heading: "Закрепление"
    questions:
      - "Дайте определение логистической системы."
      - "Чем звено отличается от элемента? Приведите по одному примеру."
      - "Что подаётся на вход логистической системы магазина?"
      - "В цепи 8 последовательных звеньев. Сколько в ней связей?"
      - "Почему рост числа звеньев увеличивает риск задержки?"

  - type: summary
    heading: "Итог занятия"
    bullets:
      - "Логистическая система — связанные звенья с общей целью"
      - "Звено — участник с функцией, элемент — его часть"
      - "Границу системы задаёт тот, кто оценивает"
      - "Чем больше звеньев, тем больше связей и рисков"
      - "Долю своих звеньев считают делением на общее число"

  - type: homework
    heading: "Домашнее задание"
    text: "Построить схему логистической системы своей компании из задания занятия 1."
    bullets:
      - "Звенья — прямоугольники, связи — стрелки"
      - "Подписать вход и выход системы"
      - "Отметить свои и сторонние звенья"
      - "Посчитать долю собственных звеньев"
    source: "Опорный учебник: Гаджинский А. М. Логистика. — М.: Дашков и К, 2017."

practice:
  kind: case
  duration: "30 мин (из 34 мин практического блока)"
  form: "индивидуально"
  goal: >-
    Научиться по описанию предприятия выделять звенья логистической системы,
    определять вход и выход, считать число звеньев, связей и долю
    собственных звеньев, формулировать вывод по результату.
  situation: >-
    ООО «Северный дом» — условное предприятие, торгует отделочными
    материалами в областном центре. Работа организована так. Плитку и краску
    предприятие закупает у двух заводов-изготовителей в другом регионе.
    Вывозит закупленный товар наёмный перевозчик — транспортная компания
    «Путь» — до собственного распределительного склада «Северного дома»
    на окраине города. На складе товар принимают, размещают на стеллажах
    и хранят. По заявкам собственная служба доставки предприятия отвозит
    товар в четыре свои розничные точки в городе, а крупным клиентам —
    строительным организациям — товар везёт та же служба доставки напрямую
    со склада. Учёт заявок и остатков ведёт отдел логистики предприятия.
  data:
    - title: "Таблица 1. Бланк для выделения звеньев"
      table:
        header: ["№", "Звено логистической системы", "Функция звена", "Своё или сторонее"]
        widths: [7, 33, 35, 25]
        rows:
          - ["1", "", "", ""]
          - ["2", "", "", ""]
          - ["3", "", "", ""]
          - ["4", "", "", ""]
          - ["5", "", "", ""]
          - ["6", "", "", ""]
    - title: "Таблица 2. Бланк для расчёта"
      table:
        header: ["Показатель", "Расчёт", "Результат"]
        widths: [42, 33, 25]
        rows:
          - ["Всего звеньев, ед.", "", ""]
          - ["Собственных звеньев, ед.", "", ""]
          - ["Доля собственных звеньев, %", "", ""]
          - ["Число связей по потоку, ед.", "", ""]
      note: "Связи считать для последовательной цепи звеньев: число звеньев минус один; ветвление на четыре розничные точки учесть отдельно."
  questions:
    - "Какие звенья образуют логистическую систему ООО «Северный дом»?"
    - "Что является входом и что выходом этой системы?"
    - "Сколько в системе звеньев, сколько из них собственных и какова их доля?"
    - "Сколько связей по материальному потоку в системе?"
    - "Какое звено предприятие не контролирует и чем это опасно?"
  steps:
    - "Прочитайте описание предприятия дважды: сначала целиком, затем отмечая карандашом каждого участника движения товара."
    - "Заполните таблицу 1: выпишите звенья в порядке движения товара, укажите функцию каждого и отметьте, своё оно или сторонее."
    - "Под таблицей 1 запишите вход системы и её выход."
    - "Заполните таблицу 2: посчитайте всего звеньев и собственных звеньев."
    - "Рассчитайте долю собственных звеньев: собственные разделите на всего и умножьте на 100 %."
    - "Посчитайте число связей по потоку с учётом ветвления на четыре розничные точки."
    - "Ответьте письменно на пятый вопрос: назовите неконтролируемое звено и один риск, который оно создаёт."
  formulas:
    - title: "Доля собственных звеньев"
      formula: "d = Зсоб / Звсего × 100 %"
      legend:
        - "d — доля собственных звеньев, %"
        - "Зсоб — число звеньев, принадлежащих предприятию, ед."
        - "Звсего — общее число звеньев логистической системы, ед."
      units: "проценты"
    - title: "Число связей в последовательной цепи"
      formula: "С = З − 1"
      legend:
        - "С — число связей по материальному потоку, ед."
        - "З — число звеньев в последовательной цепи, ед."
      units: "единицы"
  criteria:
    - ["«5»", "Все звенья выделены верно, функции указаны точно, вход и выход определены; оба расчёта выполнены без ошибок; неконтролируемое звено названо, риск сформулирован верно"]
    - ["«4»", "Звенья выделены верно, допущена 1 неточность в функциях или в определении входа/выхода; расчёты верны; риск сформулирован"]
    - ["«3»", "Выделено не менее 4 звеньев; в расчёте доли или связей 1 арифметическая ошибка; вход и выход определены частично; риск назван общо"]
    - ["«2»", "Выделено менее 4 звеньев либо вместо звеньев перечислены подразделения; расчёты не выполнены или выполнены неверно"]
  criteria_note: >-
    Розничные точки предприятия считаются одним звеном «розничная сеть»
    (четыре объекта внутри звена); допускается и вариант с выделением
    их отдельным звеном при верном последующем расчёте.
  common_mistakes:
    - "«Отдел логистики» записывают как звено: он управляет системой, а товар через него не проходит."
    - "Забывают транспортную компанию «Путь» — сторонние участники выпадают из списка."
    - "Строительные организации относят к звеньям системы, хотя это потребители за её границей."
    - "Долю собственных звеньев считают от числа собственных, а не от общего числа."
  solution:
    steps:
      - label: "Действие 1. Выделяем звенья по пути движения товара"
        comment: >-
          Заводы-изготовители (2 шт., принимаем за одно звено «поставщики»),
          транспортная компания «Путь», распределительный склад,
          служба доставки, розничная сеть из четырёх точек.
          Отдел логистики звеном не является — он управляет системой,
          товар через него не проходит.
      - label: "Действие 2. Определяем вход и выход"
        comment: >-
          Вход — плитка и краска от заводов-изготовителей, а также заявки
          розничных точек и строительных организаций. Выход — товар,
          переданный в розничные точки и крупным клиентам.
      - label: "Действие 3. Считаем всего звеньев и собственных"
        calc: "всего 5; свои 3 (склад, служба доставки, розничная сеть)"
        comment: "Сторонние: поставщики и транспортная компания «Путь»."
      - label: "Действие 4. Считаем долю собственных звеньев"
        calc: "d = 3 / 5 × 100 % = 60 %"
      - label: "Действие 5. Считаем связи по потоку"
        calc: "последовательная цепь: 5 − 1 = 4 связи; ветвление на 4 точки: 4 − 1 + 4 = 7 связей"
        comment: >-
          Последнюю связь «служба доставки — розничная сеть» заменяем
          на четыре связи с отдельными точками.
    table:
      header: ["Показатель", "Расчёт", "Результат"]
      widths: [42, 33, 25]
      rows:
        - ["Всего звеньев, ед.", "перечислением", "5"]
        - ["Собственных звеньев, ед.", "склад, доставка, розница", "3"]
        - ["Доля собственных звеньев, %", "3 / 5 × 100 %", "60 %"]
        - ["Связи в последовательной цепи, ед.", "5 − 1", "4"]
        - ["Связи с учётом четырёх точек, ед.", "4 − 1 + 4", "7"]
    answer: >-
      5 звеньев, из них 3 собственных (60 %); связей по потоку — 7
      с учётом ветвления на четыре розничные точки
    conclusion: >-
      Предприятие не контролирует два звена из пяти: поставщиков
      и транспортную компанию «Путь». Риск: при опоздании перевозчика
      склад остаётся без товара, а розничные точки — без поставки,
      причём повлиять на перевозчика напрямую предприятие не может —
      только через условия договора. Это звено нужно держать под
      постоянным контролем по срокам доставки.
